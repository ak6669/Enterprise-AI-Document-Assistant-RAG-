name: Enterprise RAG CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Production Bundle
        working-directory: frontend
        run: npm run build

  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        if: env.ACR_NAME != ''
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}

      - name: Build and Push Backend Image
        if: env.ACR_NAME != ''
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/rag-backend:${{ github.sha }} -t ${{ secrets.ACR_NAME }}.azurecr.io/rag-backend:latest -f docker/Dockerfile.backend backend/
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/rag-backend:latest
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}

      - name: Build and Push Frontend Image
        if: env.ACR_NAME != ''
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/rag-frontend:${{ github.sha }} -t ${{ secrets.ACR_NAME }}.azurecr.io/rag-frontend:latest -f docker/Dockerfile.frontend frontend/
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/rag-frontend:latest
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}

      - name: Update Backend Container App Revision
        if: env.ACR_NAME != ''
        run: |
          az containerapp update \
            --name rag-backend-app \
            --resource-group rg-enterprise-rag \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/rag-backend:latest
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}

      - name: Update Frontend Container App Revision
        if: env.ACR_NAME != ''
        run: |
          az containerapp update \
            --name rag-frontend-app \
            --resource-group rg-enterprise-rag \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/rag-frontend:latest
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
